[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diligent-expense-tracker-api"
version = "0.1.0"
description = "A REST API for managing personal expenses."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
]

[tool.pytest.ini_options]
addopts = "-q --cov=expense_tracker --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
